[package]
name = "vork-std"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Text layout and glyph outlines: Moda's text engine (crates/moda-text), shared with the 2D canvas.
moda-text = { path = "../moda-text" }
# Moda's path code: std/extrude reads SVG path data as Moda's path commands and flattens them as Moda's extrusion does.
moda-engine = { path = "../moda-engine" }
svgtypes = "0.16"
vork-time = { path = "../vork-time" }
anyhow = "1"
glam = {version="0.30",features=["serde"]}
image = {version="0.25",default-features=false,features=["png","jpeg","hdr","exr","tiff"]}
blake3 = "1"
exr = { version="1.74",default-features=false }
rquickjs = "0.12.2"
serde_json = { package = "vork-json", path = "../vork-json" }

serde = { version = "1", features = ["derive"] }
# Maintained 0.25.1 fork; preserves the outline, metric and legacy kern APIs.
ttf-parser = { package = "xberg-ttf-parser", version = "1.1" }
lyon_path = "1"
lyon_tessellation = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
