# Ported from Moda (desktop-moda native/crates/moda-text); the changes are listed in PROVENANCE.md.
[package]
name = "moda-text"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false
description = "Moda's text layout core: rich-text parsing, runs, wrapping, baselines and the vector glyph lane vork's 2D text draws with."

[lib]
bench = false
doctest = false

[dependencies]
serde_json = "1"
# The canonical plain text (unit-transform indexing).
moda-plain-text = { path = "../moda-plain-text" }
scraper = "0.27"
ego-tree = "0.11"
unicode-segmentation = "1"
unicode-normalization = "0.1"
png = "0.18"
resvg = "0.47"
cosmic-text = "0.19"
rustybuzz = "0.20"
unicode-bidi = "0.3"
unicode-bidi-mirroring = "0.4"
unicode-properties = { version = "0.1", features = ["general-category"] }
# Pinned to the release Moda builds against: sea_words.rs names its 2.3 data markers.
icu_segmenter = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
icu_provider = "2"
rustc-hash = "2"

[dev-dependencies]
moda-scene = { path = "../moda-scene" }
