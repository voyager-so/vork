# Project licence selection is deliberately independent of dependency licences.
[advisories]
ignore = [
    # paste 1.0.15 is used only as a compile-time identifier-generating proc macro
    # by pulp 0.22.3, for the vendored exr 1.74.2 DWA SIMD decoder. It does not
    # parse EXR input at runtime. The current pulp release still uses paste;
    # pastey is not an upstream dependency upgrade: adopting it here requires
    # maintaining a pulp fork/patch or replacing the decoder stack (including
    # our EXR allocation bounds patch). Keep the existing code rather than add
    # that maintenance for an unmaintained-only advisory with no reported flaw.
    # Revisit when pulp removes paste or an EXR upgrade removes this dependency.
    { id = "RUSTSEC-2024-0436", reason = "Compile-time paste through pulp/exr; no upstream upgrade removes it without a local fork" },
    # Unmaintained-only, no patched release: Moda's text core shapes with rustybuzz 0.20 and resvg 0.47, and
    # ttf-parser arrives through them and cosmic-text 0.19 (newest) via fontdb. Leaving them means rewriting
    # Moda's shaping on harfrust/skrifa. Revisit when Moda or cosmic-text/usvg move off them.
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz unmaintained; Moda's text core shapes with it and no upstream release replaces it" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained; reached through rustybuzz, usvg and cosmic-text's fontdb with no newer release dropping it" },

]

[licenses]
confidence-threshold = 0.8
allow = ["MIT", "MIT-0", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "0BSD", "CC0-1.0", "Unicode-3.0", "Unlicense", "LicenseRef-vork-Preview"]

# Mozilla CA root data used by rustls: redistribution requires carrying the
# permissive data licence; scripts/generate-notice includes its full text.
[[licenses.exceptions]]
name = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

# MPL-2.0 (file-level copyleft, used unmodified): the CSS selector parser under moda-text's HTML parser (scraper).
[[licenses.exceptions]]
name = "cssparser"
allow = ["MPL-2.0"]

# MPL-2.0 (file-level copyleft, used unmodified): the CSS selector parser under moda-text's HTML parser (scraper).
[[licenses.exceptions]]
name = "cssparser-macros"
allow = ["MPL-2.0"]

# MPL-2.0 (file-level copyleft, used unmodified): the CSS selector parser under moda-text's HTML parser (scraper).
[[licenses.exceptions]]
name = "dtoa-short"
allow = ["MPL-2.0"]

# MPL-2.0 (file-level copyleft, used unmodified): the CSS selector parser under moda-text's HTML parser (scraper).
[[licenses.exceptions]]
name = "selectors"
allow = ["MPL-2.0"]

# MPL-2.0 (file-level copyleft, used unmodified): CSS Color 4 parsing for text paints.
[[licenses.exceptions]]
name = "cssparser-color"
allow = ["MPL-2.0"]
